name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Configure MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Build llama.cpp for a broad Windows CPU baseline, not the CI host's ISA.
          export CMAKE_ARGS="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_BMI2=OFF -DGGML_FMA=OFF -DGGML_F16C=ON -DGGML_AVX512=OFF -DGGML_AVX_VNNI=OFF"
          export FORCE_CMAKE=1
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          python -m pip install --no-binary=llama-cpp-python -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify Windows runtime dependencies
        run: python -c "import llama_cpp, pyaudio, speech_recognition; print('llama.cpp, PyAudio and SpeechRecognition are available')"

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean "Astro Ai Processor.spec"

      - name: Package build output
        shell: pwsh
        run: |
          $source = "dist/Astro AI Processor"
          if (!(Test-Path $source)) { throw "Build output not found: $source" }
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          Compress-Archive -Path "$source/*" -DestinationPath "dist/windows/Astro-AI-Processor-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astro-AI-Processor-windows
          path: dist/windows/Astro-AI-Processor-windows.zip
          if-no-files-found: error
