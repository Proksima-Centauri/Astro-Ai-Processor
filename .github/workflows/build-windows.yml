name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Configure MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip install -r requirements-dev.txt

      - name: Verify Windows runtime dependencies
        run: python -c "import pyaudio, speech_recognition; print('PyAudio and SpeechRecognition are available')"

      - name: Check undefined names and duplicate methods
        run: python -m ruff check --target-version py311 --select F821,F822,F823,F722,F811 "Astro Ai Processor.py" processing deep_sky_catalog.py packaging tests

      - name: Test source startup and image processing on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean "Astro Ai Processor.spec"

      - name: Package build output
        shell: pwsh
        run: |
          $exe = "dist/Astro AI Processor.exe"
          if (!(Test-Path $exe)) { throw "One-file Windows build not found: $exe" }
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          Compress-Archive -Path $exe -DestinationPath "dist/windows/Astro-AI-Processor-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astro-AI-Processor-windows
          path: dist/windows/Astro-AI-Processor-windows.zip
          if-no-files-found: error
